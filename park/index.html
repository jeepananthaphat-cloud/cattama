:root{color-scheme:light dark;--bg:light-dark(#dff0c8,#17251a);--paper:light-dark(#fffaf0,#24301f);--ink:light-dark(#2a2320,#f3eee2);--soft:light-dark(#6b625a,#b9b3a4);--line:light-dark(#2a2320,#0c120d);--accent:#ff6f61;--teal:#2f9e8f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.3 VT323,TA8,"Menlo",monospace;overflow-x:clip}
.wrap{max-width:1240px;margin:0 auto;padding:14px max(3vw,12px) 28px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:12px}
h1{font-family:Silkscreen,TA8,monospace;font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:0}
.panel h2,.btn,.online{font-family:Silkscreen,TA8,monospace}
.sub{color:var(--soft);font-size:20px}
.online{margin-left:auto;background:var(--paper);border:3px solid var(--line);padding:4px 12px;font-size:13px;white-space:nowrap}
.online b{color:var(--teal)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.park{position:relative;height:clamp(340px,58vh,560px);border:4px solid var(--line);overflow:hidden;background:#8fd0f0;image-rendering:pixelated;user-select:none;-webkit-user-select:none}
.park canvas.bg,.park canvas.prop{position:absolute;left:0;top:0;image-rendering:pixelated;pointer-events:none}
.cat{position:absolute;left:0;top:0;cursor:pointer;will-change:transform}
.cat img.body{display:block;image-rendering:pixelated;width:100%;height:100%}
.cat.me .tag{background:var(--accent);color:#fff}
.cat.showtag .tag{display:block}
.cat .shadow{position:absolute;left:50%;transform:translateX(-50%);image-rendering:pixelated;pointer-events:none}
.cat img.body{position:relative}
.tag{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;font-size:15px;line-height:1;padding:3px 6px 4px;background:#fffaf0;color:#2a2320;border:2px solid #2a2320;white-space:nowrap}
.bubble{position:absolute;left:0;top:0;z-index:999999;transform:translate(-50%,-100%);transform-origin:50% 100%;background:#fff;color:#2a2320;border:3px solid #2a2320;padding:6px 10px 7px;font-size:16px;line-height:1.3;max-width:220px;width:max-content;text-align:center;overflow-wrap:anywhere;font-size:20px;box-shadow:3px 3px 0 rgba(0,0,0,.18);animation:pop .18s steps(3) both;pointer-events:none}
.bubble::after{content:"";position:absolute;left:calc(50% + var(--tail,0px));bottom:-8px;width:10px;height:10px;margin-left:-5px;background:#fff;border-right:3px solid #2a2320;border-bottom:3px solid #2a2320;transform:rotate(45deg)}
@keyframes pop{from{transform:translate(-50%,-100%) scale(.4)}to{transform:translate(-50%,-100%) scale(1)}}
.heart{position:absolute;width:14px;height:13px;pointer-events:none;animation:float 1.3s steps(8) forwards}
@keyframes float{to{transform:translateY(-46px);opacity:0}}
.chat{display:flex;gap:8px;margin-top:10px}
.chat input{flex:1;font:inherit;font-size:20px;padding:10px 12px;border:3px solid var(--line);background:var(--paper);color:var(--ink);min-height:48px}
.chat input:focus-visible,.btn:focus-visible,.coats button:focus-visible,.name:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{font-size:14px;min-height:48px;padding:0 18px;border:3px solid var(--line);background:var(--accent);color:#fff;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.alt{background:var(--paper);color:var(--ink)}
.emotes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.emotes button{font:inherit;font-size:19px;min-height:40px;padding:0 10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
aside{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);border:3px solid var(--line);padding:12px}
.panel h2{font-size:16px;margin:0 0 8px}
.name{width:100%;font:inherit;font-size:16px;padding:8px 10px;border:3px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.me-card{display:flex;gap:12px;align-items:center}.me-pic{width:96px;height:96px;flex:none;background:var(--bg);border:3px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.me-pic img{width:108px;height:108px;image-rendering:pixelated;margin-bottom:-6px}
.me-name{font-family:Silkscreen,TA8,monospace;font-size:20px;line-height:1.1}.me-info{color:var(--soft);font-size:18px}
.me-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.coats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.coats button{height:58px;border:2px solid var(--line);background:var(--bg);padding:0;cursor:pointer;overflow:hidden;display:flex;justify-content:center;align-items:flex-start}
.coats button img{width:60px;height:60px;image-rendering:pixelated;margin-top:-4px}
.coats button.on{background:#ffd9d4;box-shadow:inset 0 0 0 3px var(--accent)}
.log{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;font-size:19px;display:flex;flex-direction:column;gap:6px}
.log li{line-height:1.35;overflow-wrap:anywhere}
.log .mute{font:inherit;font-size:14px;border:1px solid var(--line);background:none;color:var(--soft);cursor:pointer;padding:0 5px;opacity:.55}.log li:hover .mute{opacity:1}
.dot::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;background:#c9a14a}.dot.on::before{background:#3fbf6a}
.log b{color:var(--teal)}.log .mine b{color:var(--accent)}.log .sys{color:var(--soft)}
.note{font-size:17px;color:var(--soft);margin-top:8px}
@media(max-width:600px){.btn{padding:0 12px}.tag{font-size:12px}.bubble{font-size:15px;max-width:170px}}
@media(prefers-reduced-motion:reduce){.bubble,.heart{animation:none}}
</style>
</head>

  <header>

      </form>

      <p class="note">Cats with “· park cat” live here and keep the park lively when few players are around.</p>

      c.bubble.style.left = Math.round(c.x + sh) + 'px'; c.bubble.style.setProperty('--tail', -sh + 'px');
      if (now > c.bubbleUntil) { c.bubble.remove(); c.bubble = null; }
    }
  }
  for (let i = 0; i < cats.length; i++) for (let j = i + 1; j < cats.length; j++) {
    const a = cats[i], b = cats[j];
    if (Math.abs(a.x - b.x) < 34 * CS && Math.abs(a.y - b.y) < 16 * CS && Math.random() < 0.002) { hearts(a); if (a.npc && !a.bubble) say(a, pick(REPLIES)); }
  }
  if (me && !home) report(now);
  requestAnimationFrame(tick);
}
size();
// ---------- who am I: the CatTama app opens this page with the cat in the address ----------
const Q = new URLSearchParams(location.search);
const myName = (Q.get('n') || '').trim().slice(0, 16), myCoat = clamp(parseInt(Q.get('c'), 10) || 0, 0, 7);
const myId = (Q.get('id') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || (() => { try { let v = localStorage.getItem('catparkId'); if (!v) { v = 'w' + Math.random().toString(36).slice(2, 12); localStorage.setItem('catparkId', v); } return v; } catch { return 'w' + Math.random().toString(36).slice(2, 12); } })();
const fromApp = !!myName;
const muted = new Set();
let me = null;
const homeBtn = document.getElementById('homeBtn'), meState = document.getElementById('meState');
if (fromApp) {
  me = makeCat(myName, myCoat, true); me.pid = myId;
  me.x = Math.random() < 0.5 ? -40 : W + 40; me.y = laneY(); walkTo(me, rnd(W * 0.3, W * 0.7), me.y);   // walks in from the side
  document.getElementById('mePic').src = SP[myCoat].sit;
  document.getElementById('meName').textContent = myName;
  document.getElementById('meCoat').textContent = ['Tabby', 'Orange', 'Gray', 'Black', 'Tuxedo', 'White', 'Calico', 'Siamese'][myCoat] + ' · from your Mac';
} else {
  document.getElementById('meCard').innerHTML = '<p class="note" style="margin:0">You are watching. To bring your cat, open Cat Park from the CatTama app on your Mac.</p>';
  document.getElementById('chatForm').style.display = 'none'; document.getElementById('emotes').style.display = 'none';
}

// ---------- positions travel as "which surface + how far along it", so every screen size agrees ----------
const lane = () => laneBot() - laneTop();
function enc(x, y, p) { return p >= 0 ? { p, u: +((x - plats[p].x0) / Math.max(1, plats[p].x1 - plats[p].x0)).toFixed(3) } : { p: -1, u: +(x / W).toFixed(3), v: +((y - laneTop()) / lane()).toFixed(3) }; }
function dec(m) {
  const p = (m.p >= 0 && plats[m.p]) ? m.p : -1;
  if (p >= 0) { const q = plats[p]; return [q.x0 + clamp(m.u, 0, 1) * (q.x1 - q.x0), q.y, p]; }
  return [clamp(m.u, 0, 1) * W, laneTop() + clamp(m.v ?? 0.5, 0, 1) * lane(), -1];
}
// what my cat is doing, as one small message
function myAction() {
  const c = me;
  if (c.st === 'walk' || c.st === 'run') { const p = c.goal && c.goal.k === 'plat' ? -1 : c.plat; return { a: c.st, ...enc(c.tx, c.ty, p) }; }
  if (c.st === 'jump') return { a: 'jump', ...enc(c.j.x1, c.j.y1, c.j.plat) };
  return { a: c.st === 'loaf' ? 'loaf' : 'sit', ...enc(c.x, c.y, c.plat) };
}
let lastKey = '', lastSent = 0, seq = 0, pendingSend = null;
function report(now) {
  const m = myAction(), key = JSON.stringify(m);
  if (key === lastKey) return;
  if (now - lastSent < 180) { if (!pendingSend) pendingSend = setTimeout(() => { pendingSend = null; lastKey = ''; report(performance.now()); }, 200); return; }
  lastKey = key; lastSent = now;
  track({ ...m, s: ++seq });
}

// ---------- other players' cats follow what they report ----------
const remotes = new Map();
function applyRemote(c, m, snap) {
  if (m.s <= (c.seq || 0)) return; c.seq = m.s;
  const [x, y, p] = dec(m);
  c.after = m.a === 'loaf' ? 'loaf' : 'sit';
  if (snap || !c.placed) { c.placed = true; c.x = x; c.y = y; c.plat = p; c.st = m.a === 'walk' || m.a === 'run' || m.a === 'jump' ? c.after : m.a; c.until = Infinity; return; }
  if (m.a === 'jump' || p !== c.plat) { if (c.st !== 'jump') jumpTo(c, x, y, p); else { c.j.x1 = x; c.j.y1 = y; c.j.plat = p; } return; }
  if (Math.hypot(x - c.x, y - c.y) > 4) { walkTo(c, x, y, null, m.a === 'run'); c.until = performance.now() + 20000; }
  else { c.st = c.after; c.until = Infinity; }
}
function syncPresence(state) {
  const seen = new Set();
  for (const key in state) {
    if (key === myId) continue;
    const metas = state[key], m = metas && metas[metas.length - 1];
    if (!m || !m.n) continue;
    seen.add(key);
    let c = remotes.get(key);
    if (!c) {
      c = makeCat(String(m.n).slice(0, 16), clamp(m.c | 0, 0, 7), false); c.remote = true; c.pid = key; c.until = Infinity;
      remotes.set(key, c); sys(c.name + ' came to the park');
      c.placed = false; applyRemote(c, m, true);
      c.x = m.p >= 0 ? c.x : (Math.random() < 0.5 ? -40 : W + 40); if (c.plat < 0) { const [x, y] = dec(m); walkTo(c, x, y); c.after = m.a === 'loaf' ? 'loaf' : 'sit'; }
    } else applyRemote(c, m, false);
  }
  for (const [key, c] of remotes) if (!seen.has(key)) {           // left the park: walk off and go
    remotes.delete(key); sys(c.name + ' went home');
    c.remote = false; c.npc = true; c.plat = -1; walkTo(c, c.x < W / 2 ? -90 : W + 90, c.y, { k: 'leave' }); c.until = performance.now() + 30000;
    setTimeout(() => { c.el.remove(); if (c.bubble) c.bubble.remove(); cats.splice(cats.indexOf(c), 1); count(); }, 9000);
  }
  count(); fillWithParkCats();
}

// ---------- park cats: only while the park is quiet ----------
const parkCats = [];
function fillWithParkCats() {
  const players = cats.filter(c => !c.npc).length, want = Math.max(0, Math.min(NPC.length, 3 - players));
  while (parkCats.length < want) { const [n, k] = NPC[parkCats.length]; const c = makeCat(n, k, false); c.npc = true; c.pid = 'npc' + n; c.tag.textContent = n + ' · park cat'; parkCats.push(c); count(); }
  while (parkCats.length > want) { const c = parkCats.pop(); c.goal = { k: 'leave' }; c.plat = -1; walkTo(c, c.x < W / 2 ? -90 : W + 90, c.y, { k: 'leave' }); c.until = performance.now() + 30000;
    setTimeout(() => { c.el.remove(); if (c.bubble) c.bubble.remove(); cats.splice(cats.indexOf(c), 1); count(); }, 9000); }
}
setInterval(() => { const npcs = parkCats.filter(c => !c.bubble); if (npcs.length && Math.random() < 0.35) say(pick(npcs), pick(LINES)); }, 5000);

// ---------- the server: Supabase Realtime (presence = who is here and what they do · broadcast = chat and pets) ----------
const SB_URL = 'https://exzsczussggzufxiktbj.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4enNjenVzc2dnenVmeGlrdGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2NzE1MTksImV4cCI6MjExMTI0NzUxOX0.jAaV1cBIfn6-NOdpHcXn8NLj11nmjyz-XdP_bAF8Mxo';
const status = document.getElementById('status');
let chan = null, live = false;
function track(m) { if (chan && live && me && !home) chan.track({ n: myName, c: myCoat, ...m }).then(r => { if (r !== 'ok') console.log('[catpark] track', r); }).catch(e => console.log('[catpark] track error', e)); }
let sb = null, retryT = 0;
function connect() {
  if (!window.supabase) { status.textContent = 'offline'; return; }
  if (!sb) sb = window.supabase.createClient(SB_URL, SB_KEY, { realtime: { params: { eventsPerSecond: 8 }, worker: true, heartbeatIntervalMs: 15000 } });
  if (chan) { try { sb.removeChannel(chan); } catch {} chan = null; }
  live = false;
  const c = sb.channel('catpark-main', { config: { presence: { key: myId }, broadcast: { self: false } } });
  chan = c;
  c.on('presence', { event: 'sync' }, () => { if (chan === c) syncPresence(c.presenceState()); });
  c.on('broadcast', { event: 'chat' }, ({ payload }) => { const k = remotes.get(payload.id); if (k && typeof payload.t === 'string') say(k, clean(payload.t)); });
  c.on('broadcast', { event: 'pet' }, ({ payload }) => {
    if (me && payload.to === myId && !home) { hearts(me); const from = remotes.get(payload.id); sys((from ? from.name : 'Someone') + ' petted ' + me.name + ' ❤️'); }
    else { const k = remotes.get(payload.to); if (k) hearts(k); }
  });
  c.subscribe((st, err) => {
    if (chan !== c) return;
    console.log('[catpark]', st, err ? (err.message || err) : '');
    const ok = st === 'SUBSCRIBED';
    status.textContent = ok ? 'online' : 'connecting…'; status.className = 'dot ' + (ok ? 'on' : '');
    if (ok) { live = true; lastKey = ''; if (me && !home) { seq++; track({ ...myAction(), s: seq }); } }
    else { live = false; clearTimeout(retryT); retryT = setTimeout(connect, 3000); }   // dropped: join again
  });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !live) connect(); });
setInterval(() => { if (!live && !document.hidden) connect(); }, 15000);
window.__park = () => ({ live, state: chan && chan.state, players: remotes.size });

// ---------- chat: short, slowed down, rude words hidden ----------
const BAD = ['fuck', 'shit', 'bitch', 'cunt', 'dick', 'pussy', 'nigg', 'fag', 'slut', 'whore', 'ควย', 'เหี้ย', 'สัส', 'เย็ด', 'แตด', 'ดอกทอง', 'ระยำ', 'ชาติหมา', 'อีดอก', 'ไอ้สัตว์', 'อีสัตว์'];
function clean(t) { t = String(t).replace(/[\u0000-\u001f]/g, '').trim().slice(0, 60); for (const w of BAD) t = t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => '*'.repeat([...m].length)); return t; }
let lastChat = 0;
function send(text) {
  if (!me || home) return;
  const now = performance.now(); text = clean(text); if (!text) return;
  if (now - lastChat < 2500) { sys('Slow down a little 🐾'); return; }
  lastChat = now;
  say(me, text);
  if (chan && live) chan.send({ type: 'broadcast', event: 'chat', payload: { id: myId, t: text } });
  if (!remotes.size && parkCats.length && Math.random() < 0.7) { const near = parkCats[0]; setTimeout(() => say(near, pick(REPLIES)), rnd(1200, 2600)); }
}
function petCat(c) {
  if (c.me) return;
  if (c.npc) { if (!c.bubble) say(c, pick(REPLIES)); return; }
  if (me && chan && live) chan.send({ type: 'broadcast', event: 'pet', payload: { id: myId, to: c.pid } });
}
const form = document.getElementById('chatForm'), msg = document.getElementById('msg');
form.addEventListener('submit', e => { e.preventDefault(); send(msg.value); msg.value = ''; });
document.getElementById('emotes').innerHTML = EMOTES.map(t => `<button type="button">${t}</button>`).join('');
document.getElementById('emotes').addEventListener('click', e => { const b = e.target.closest('button'); if (b) send(b.textContent); });

// ---------- my cat's buttons ----------
function gone() {
  if (!home || me.el.style.display === 'none') return;
  me.el.style.display = 'none'; if (me.bubble) { me.bubble.remove(); me.bubble = null; } me.goal = null; me.st = 'sit'; me.until = Infinity;
  cats.splice(cats.indexOf(me), 1); count(); sys(me.name + ' went home to the Mac');
  if (chan && live) chan.untrack().catch(() => {});
  meState.textContent = 'Back home on your Mac'; homeBtn.style.display = 'none';
  try { location.href = 'cattama://home?id=' + encodeURIComponent(myId); } catch {}           // tells the CatTama app the cat is back
}
if (fromApp) {
  homeBtn.addEventListener('click', () => {
    if (home) return;
    home = true; homeBtn.disabled = true; meState.textContent = 'Walking home…';
    if (me.plat >= 0) { const p = plats[me.plat], [x, y] = groundNear(me.x, p.gy); jumpTo(me, x, y, -1); me.goal = { k: 'home' }; }
    else if (me.st === 'jump') me.goal = { k: 'home' };
    else { walkTo(me, me.x < W / 2 ? -90 : W + 90, me.y, { k: 'home' }); me.until = performance.now() + 30000; }
  });
  document.getElementById('sitBtn').addEventListener('click', () => { if (home || me.st === 'jump') return; me.goal = null; me.st = 'sit'; me.until = performance.now() + 8000; });
  document.getElementById('napBtn').addEventListener('click', () => { if (home || me.st === 'jump') return; me.goal = null; me.st = 'loaf'; me.until = performance.now() + 15000; });
  park.addEventListener('click', e => {
    if (home || me.st === 'jump') return;
    const r = park.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const pi = plats.findIndex(p => px >= p.x0 - 8 && px <= p.x1 + 8 && py >= p.y - 30 * S && py <= p.y + 8 * S);
    if (pi >= 0) { const p = plats[pi], tx = clamp(px, p.x0 + 4 * S, p.x1 - 4 * S);
      if (me.plat === pi) walkTo(me, tx, p.y);
      else if (me.plat >= 0) jumpTo(me, tx, p.y, pi); else walkTo(me, tx, p.gy, { k: 'plat', i: pi }); me.until = performance.now() + 14000; return; }
    const gyS = clamp(py, laneTop(), laneBot());
    if (me.plat >= 0) jumpTo(me, px, gyS, -1); else walkTo(me, px, gyS);
  });
}
// leaving the tab: everyone else sees the cat go
addEventListener('pagehide', () => { if (chan) chan.untrack().catch(() => {}); });
new ResizeObserver(() => { const ow = W, oh = H; size(); if (!ow) return;
  for (const c of cats) { c.x = c.x / ow * W; c.y = c.plat >= 0 ? plats[c.plat]?.y ?? laneY() : c.y / oh * H; if (c.st === 'jump') { c.st = 'sit'; c.plat = -1; c.y = laneY(); } } }).observe(park);
fillWithParkCats();
sys(fromApp ? 'Tip: click the playground, a branch or the log and your cat climbs up. Click another cat to pet it.' : 'Watching the park. Click a cat to say hi.');
connect();
requestAnimationFrame(tick);
}
